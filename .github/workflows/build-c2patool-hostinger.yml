name: Build c2patool for Hostinger

on:
  push:
    branches:
      - build/c2patool-hostinger
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Build official c2patool v0.27.22 in Debian 11
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            debian:11 \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl build-essential pkg-config libssl-dev git
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
              sh /tmp/rustup.sh -y --default-toolchain stable
              . /root/.cargo/env
              git clone --depth 1 --branch c2patool-v0.27.22 https://github.com/contentauth/c2pa-rs.git /tmp/c2pa-rs
              cd /tmp/c2pa-rs/cli
              cargo build --release
              cp target/release/c2patool /work/c2patool-linux-glibc234
              chmod 755 /work/c2patool-linux-glibc234
              file /work/c2patool-linux-glibc234
              ldd /work/c2patool-linux-glibc234 | head -30
            '

      - name: Verify executable
        run: |
          ./c2patool-linux-glibc234 --version
          sha256sum ./c2patool-linux-glibc234 | tee c2patool-linux-glibc234.sha256

      - name: Upload c2patool artifact
        uses: actions/upload-artifact@v4
        with:
          name: c2patool-linux-glibc234
          path: |
            c2patool-linux-glibc234
            c2patool-linux-glibc234.sha256
          retention-days: 7
