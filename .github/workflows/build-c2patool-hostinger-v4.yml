name: Build c2patool for Hostinger v4

on:
  push:
    branches:
      - build/c2patool-hostinger
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Build c2patool as static musl binary
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            rust:1.98.1-alpine3.24 \
            sh -euxo pipefail -c '
              apk add --no-cache \
                build-base \
                musl-dev \
                perl \
                cmake \
                pkgconf \
                binutils \
                git \
                ca-certificates

              cargo install --locked \
                --root /work/out \
                --git https://github.com/contentauth/c2pa-rs \
                --tag c2patool-v0.27.22 \
                c2patool

              strip -o /work/c2patool-linux-musl-v4 \
                /work/out/bin/c2patool

              chmod 755 /work/c2patool-linux-musl-v4

              file /work/c2patool-linux-musl-v4

              /work/c2patool-linux-musl-v4 --version
            '

      - name: Verify executable
        run: |
          file ./c2patool-linux-musl-v4
          ./c2patool-linux-musl-v4 --version
          sha256sum ./c2patool-linux-musl-v4 | tee c2patool-linux-musl-v4.sha256

      - name: Upload c2patool artifact
        uses: actions/upload-artifact@v4
        with:
          name: c2patool-linux-musl-v4
          path: |
            c2patool-linux-musl-v4
            c2patool-linux-musl-v4.sha256
          retention-days: 7
